services:
  secops-ai-workbench:
    build:
      context: .
      dockerfile: Dockerfile
    image: secops-ai-workbench:latest
    container_name: secops-ai-workbench
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      SQLITE_DB_PATH: "/data/secops-ai-workbench.sqlite"
      APP_SECRET: "${APP_SECRET:-change-this-before-production}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-0}"
    volumes:
      - secops-ai-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  secops-ai-data:
